name: Publish APT Packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudsmith configuration
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.CLOUDSMITH_API_KEY }}" ]; then
            echo "Secret CLOUDSMITH_API_KEY is required."
            exit 1
          fi

      - name: Download and verify release .deb assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            exit 1
          fi
          mkdir -p dist
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.deb" \
            --dir dist
          if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "ASSET-INVENTORY.json" --dir dist >/dev/null 2>&1 && \
             gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "SHA256SUMS" --dir dist >/dev/null 2>&1; then
            checksum_file=dist/SHA256SUMS
            unified_release=true
          else
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "sha256sums.txt" --dir dist
            checksum_file=dist/sha256sums.txt
            unified_release=false
          fi
          shopt -s nullglob
          packages=(dist/*.deb)
          ((${#packages[@]} > 0)) || { echo "No Debian packages found"; exit 1; }
          for package in "${packages[@]}"; do
            name=$(basename "${package}")
            expected=$(awk -v name="${name}" '$2 == name { print $1 }' "${checksum_file}")
            actual=$(sha256sum "${package}" | awk '{ print $1 }')
            [[ "${expected}" =~ ^[0-9a-f]{64}$ && "${actual}" == "${expected}" ]] || {
              echo "SHA-256 mismatch for ${name}"
              exit 1
            }
            if [[ "${unified_release}" == true ]]; then
              inventory_digest=$(jq -r --arg name "${name}" '
                .payloads[] |
                select(.name == $name and .kind == "nfpm" and .packageFormat == "deb") |
                .sha256
              ' dist/ASSET-INVENTORY.json)
              [[ "${inventory_digest}" == "${expected}" ]] || {
                echo "${name} is not the verified Debian package in ASSET-INVENTORY.json"
                exit 1
              }
            fi
          done

      - name: Install Cloudsmith CLI
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install cloudsmith-cli==1.11.1

      - name: Publish to Cloudsmith APT repository
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPO: openclaw/graincrawl
          CLOUDSMITH_APT_TARGETS: ${{ vars.CLOUDSMITH_APT_TARGETS }}
          CLOUDSMITH_DISTRIBUTION: ${{ vars.CLOUDSMITH_DISTRIBUTION }}
          CLOUDSMITH_RELEASE: ${{ vars.CLOUDSMITH_RELEASE }}
        run: |
          set -euo pipefail
          APT_TARGETS="${CLOUDSMITH_APT_TARGETS:-}"

          if [ -z "${APT_TARGETS}" ]; then
            if [ -n "${CLOUDSMITH_DISTRIBUTION:-}" ] && [ -n "${CLOUDSMITH_RELEASE:-}" ]; then
              APT_TARGETS="${CLOUDSMITH_DISTRIBUTION}/${CLOUDSMITH_RELEASE}"
            else
              APT_TARGETS="ubuntu/jammy,debian/trixie"
            fi
          fi

          for target_path in $(printf '%s' "${APT_TARGETS}" | tr ',' ' '); do
            [ -z "${target_path}" ] && continue
            TARGET="${CLOUDSMITH_REPO}/${target_path}"
            for pkg in dist/*.deb; do
              cloudsmith push deb "${TARGET}" "${pkg}" --no-wait-for-sync
            done
          done
