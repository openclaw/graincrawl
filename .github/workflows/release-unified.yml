name: Release (unified)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify without publishing
        type: boolean
        default: true
      version:
        description: SemVer to release
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@93d1c4e7ae6b27022954c847b63ed4998a6b7062
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      repository-type: openclaw
      homebrew-tap: openclaw/homebrew-tap
      homebrew-formula: graincrawl
      nfpm: auto
      reproducible-rebuild: non-darwin
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
