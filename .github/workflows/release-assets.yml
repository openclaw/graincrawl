name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Published release tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runs-on }}
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          archive="graincrawl_${version}_darwin_${{ matrix.arch }}.tar.gz"
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir artifacts \
            --pattern "${archive}" \
            --pattern "${archive}.sha256"
          test -f "artifacts/${archive}"
          test -f "artifacts/${archive}.sha256"

      - name: Verify Developer ID signature
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="artifacts/graincrawl_${version}_darwin_${{ matrix.arch }}.tar.gz"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            scripts/verify-graincrawl-release.sh "${RELEASE_TAG}" "${archive}"
